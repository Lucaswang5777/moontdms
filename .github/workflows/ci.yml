name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned official MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain and interfaces
        run: |
          moon version --all
          moonc -v
          moon info --target all
          moon fmt --check
          git diff --exit-code
      - name: Strict check test and build
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
      - name: Downstream workflows
        run: |
          moon run examples/ingest --deny-warn --target ${{ matrix.target }}
          moon run examples/crop --deny-warn --target ${{ matrix.target }}
          moon run examples/report --deny-warn --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target == 'js'
        with:
          python-version: '3.12'
      - name: Independent compatibility and source audit
        if: matrix.target == 'js'
        run: |
          python -m pip install numpy==2.3.5 npTDMS==1.10.0
          python scripts/differential.py --no-build
          python scripts/cli_smoke.py
          python scripts/audit.py
